name: Atlasia Lighthouse (mobil)

# G3 + B5 — CI'da mobil Lighthouse ve bütçe kapısı.
#
# NEDEN AYRI İŞ AKIŞI: ana CI 15 dakikalık bir sözleşme; Lighthouse iki koşu
# yaptığı için oraya sığmaz ve sık düşen bir adım tüm CI'yı gürültüye çevirir.
# Ayrı dosya, kapının kendi görünürlüğünü korur (PR'da ayrı check).
on:
  pull_request:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlasia-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Mobil Lighthouse + bütçe
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build (bundle budget included)
        run: npm run build

      # Chrome yolu: chrome-launcher, runner imajında Chromium'u her zaman
      # bulamıyor (a2d02fe koşusunda adım tam bu yüzden düştü). Yolu burada
      # çözüp CHROME_PATH olarak veriyoruz; bulunamazsa iş erken ve anlaşılır
      # biçimde kırılır (Lighthouse'u sessizce atlamak yok).
      - name: Chrome yolunu belirle
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ] && [ -x /opt/google/chrome/chrome ]; then CHROME=/opt/google/chrome/chrome; fi
          if [ -z "$CHROME" ]; then
            echo "::error title=Chrome bulunamadi::Runner imajinda Chrome/Chromium yok; Lighthouse kosulamaz."
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      # @lhci/cli DEPENDENCY DEĞİL (bilinçli): geliştirme bağımlılığı olarak
      # eklemek `npm audit` matrisine 13 yüksek/dev açık sokuyordu (chromium-bidi
      # → zod). CI'da sürüm sabit `npx` ile çalışır, üretim ve yerel ağaç temiz
      # kalır. G4 matrisi bu kararı belgeliyor.
      # KOŞU / KAPI / YÜKLEME AYRI ADIMLAR. Neden: `lhci autorun` assert
      # düştüğünde upload'a hiç gelmiyor, yani `.lighthouseci` diskte kalıyor ama
      # artifact'a girmiyordu (ed1542b: "no valid artifacts found"). Ayrı
      # adımlarla rapor her durumda saklanır ve skorlar okunabilir olur.
      - name: Lighthouse mobil — koşu
        id: lighthouse
        run: |
          set -o pipefail
          npx --yes @lhci/cli@0.15.1 collect 2>&1 | tee lighthouse.log

      - name: Lighthouse mobil — kapı (perf ≥90, a11y ≥95, BP ≥95, SEO ≥95)
        id: lighthouse-assert
        run: |
          set -o pipefail
          npx --yes @lhci/cli@0.15.1 assert 2>&1 | tee -a lighthouse.log

      # Adım logu Actions API'sinden okunamıyor (results-receiver EOF). Kapı
      # düştüğünde nedeni görünür kılmak için ilgili satırlar annotation ve iş
      # özetine taşınır — kural testlerindeki desenin aynısı.
      - name: Lighthouse hatasını annotation'a taşı
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("lighthouse.log")
          raw = path.read_text(encoding="utf-8", errors="replace") if path.exists() else "(lighthouse.log yok: adım tarayıcı açılmadan düştü)"
          lines = [line for line in raw.splitlines() if line.strip()]
          interesting = [line for line in lines if any(k in line.lower() for k in
                         ("error", "failed", "failure", "assert", "score", "budget", "chrome", "timeout", "✘", "✗"))]
          body = "\n".join((interesting[-30:] or lines[-30:]))[-8000:]

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## Lighthouse — başarısız\n\n```\n" + body + "\n```\n")

          chunk = 3800
          parts = [body[i:i + chunk] for i in range(0, len(body), chunk)][:3] or ["(çıktı yok)"]
          for index, part in enumerate(parts, start=1):
              escaped = part.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Lighthouse hatasi {index}/{len(parts)}::{escaped}")
          PY

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
          if-no-files-found: warn

      # Skorlar API'den okunabilsin diye NOTICE annotation olarak da basılır
      # (iş özeti yalnız arayüzde görünüyor).
      - name: Özet (skorlar ve düşen denetimler)
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json, os

          lines = ["## Mobil Lighthouse", "", "| Koşu | Perf | A11y | BP | SEO |", "| --- | --- | --- | --- | --- |"]
          notices = []
          failing = {}
          for path in sorted(glob.glob(".lighthouseci/lhr-*.json")):
              data = json.load(open(path, encoding="utf-8"))
              cats = data.get("categories", {})
              score = lambda key: round(((cats.get(key, {}) or {}).get("score") or 0) * 100)
              name = os.path.basename(path).replace(".json", "")
              lines.append(f"| {name} | {score('performance')} | {score('accessibility')} | "
                           f"{score('best-practices')} | {score('seo')} |")
              notices.append(
                  f"{name}: perf {score('performance')} · a11y {score('accessibility')} · "
                  f"BP {score('best-practices')} · SEO {score('seo')}")
              for key, audit in (data.get("audits") or {}).items():
                  if audit.get("score") is not None and audit["score"] < 1 and audit.get("scoreDisplayMode") == "binary":
                      failing.setdefault(f"{key}: {audit.get('title')}", 0)
                      failing[f"{key}: {audit.get('title')}"] += 1

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          body = "\n".join(lines)
          if failing:
              body += "\n\nBaşarısız denetimler:\n\n" + "\n".join(f"- {k}" for k in sorted(failing))
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(body + "\n")
          print(body)
          for notice in notices:
              print(f"::notice title=Lighthouse skor::{notice}")
          for key in sorted(failing):
              print(f"::notice title=Düşen denetim::{key}")
          PY
