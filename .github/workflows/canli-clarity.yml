name: Canlı Clarity doğrulaması

# Neden var: "Clarity panelinde veri görünmüyor" şikâyeti kod tarafında değil,
# çoğu zaman yayındaki CSP veya tarayıcı engeli yüzünden çıkıyor. Bu iş gerçek
# alan adına gerçek Chromium'la gidip rıza akışını çalıştırır, tag isteğinin
# 200 döndüğünü ve CSP ihlali olmadığını doğrular. Deploy yapmaz.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  dogrula:
    name: Yayında Clarity zinciri
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install exact dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Canlı Clarity testi
        run: npm run test:e2e:canli
        env:
          ATLASIA_CANLI_BASE: ${{ vars.ATLASIA_CANLI_BASE || 'https://atlasia.pages.dev' }}

      - name: Yapılandırma + tag denetimi (Node)
        run: node scripts/canli-yapilandirma.mjs
