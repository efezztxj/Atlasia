name: Atlasia CI

on:
  pull_request:
  push:
    branches: [main, "arena/**"]

permissions:
  contents: read

concurrency:
  group: atlasia-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security, typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Use Java 21 for the Firestore emulator
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache the pinned Firestore emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/atlasia/firebase-emulators
          key: firestore-emulator-${{ runner.os }}-1.22.0

      - name: Install exact dependencies
        run: npm ci

      - name: Check production dependency security baseline
        run: npm run audit:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # github-actions raporlayıcısı: düşen test, log indirmeden check-run
        # annotation'ı olarak API'den de okunabilsin (kurallar adımıyla aynı fikir).
        run: npm test -- --reporter=default --reporter=github-actions

      - name: Script tests (no credentials)
        run: npm run test:scripts

      - name: Firestore security rules tests
        id: rules-tests
        run: |
          set -o pipefail
          npm run test:rules:emulator 2>&1 | tee rules-emulator.log

      # Emülatör adımının logu Actions arayüzü dışında okunamıyor; başarısızlıkta
      # ilgili satırları check-run annotation'ına ve iş özetine taşır. Böylece
      # hangi kural testinin neden düştüğü API üzerinden de görünür olur.
      - name: Kural testi hatasını annotation ve iş özetine taşı
        if: always() && steps.rules-tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          raw = Path("rules-emulator.log").read_text(encoding="utf-8", errors="replace")
          # Terminal renk kodları annotation metninde okunmayı bozuyor; hem gerçek
          # ESC baytını hem de düz metin olarak düşmüş "^[[..m" biçimini temizle.
          text = re.sub(r"(\x1b\[[0-9;]*[A-Za-z]|\^\[[0-9;]*m)", "", raw)
          lines = text.splitlines()

          # Vitest'in hata bloğu: "Failed Tests" başlığından dosya sonuna kadar.
          start = next((i for i, l in enumerate(lines)
                        if "Failed Tests" in l or l.strip().startswith("FAIL ")), max(0, len(lines) - 120))
          block = lines[start:start + 160]
          # Hangi satırın düştüğünü gösteren işaretçiler ayrıca değerlidir.
          pointers = [l for l in lines if "❯" in l or "tests/firestore.rules.test.ts:" in l]
          body = "\n".join((["--- SATIR ISARETCILERI ---"] + pointers[:30] + ["--- HATA BLOGU ---"] if pointers else []) + block)
          body = body[:20000] or text[-4000:]

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## Firestore kural testleri — başarısız\n\n```\n" + body + "\n```\n")

          # İş özeti API'den okunamıyor; annotation'lar okunabiliyor. Tek annotation
          # kırpıldığı için gövdeyi parçalara bölüp birden çok annotation basıyoruz.
          chunk = 4000
          parts = [body[i:i + chunk] for i in range(0, len(body), chunk)][:8]
          for index, part in enumerate(parts, start=1):
              escaped = part.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Kural testi hatasi {index}/{len(parts)}::{escaped}")
          PY

      - name: Production build and bundle budget
        run: npm run build

      - name: Install Playwright Chromium for E2E smoke suite
        run: npx playwright install --with-deps chromium

      - name: Browser E2E + axe erişilebilirlik kapısı (Playwright)
        run: npm run test:e2e

      # S4: gerçek LCP/TBT ölçen kapı. Paket bütçesi (kB) tek başına yeterli
      # değil; burada üretim derlemesi mobil profilde 3 kez ölçülür, medyan
      # değerlendirilir. Eşikler lighthouserc.cjs içinde ve düşürülmesi yasak.
      #
      # Chrome: koşucuda sistem Chrome'u garanti değil (ilk koşu "Chrome
      # installation not found" ile düştü). Zaten bir önceki adımda kurulan
      # Playwright Chromium'u kullanılıyor; yol sürüme göre değiştiği için
      # `playwright-core`tan okunuyor.
      - name: Chromium yolunu Lighthouse'a ver
        run: |
          CHROME=$(node -e "const { chromium } = require('playwright-core'); console.log(chromium.executablePath())")
          test -x "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      # Log okuma notu: GitHub API bu işin adım log'unu vermiyor ("EOF"), yalnız
      # annotation okunabiliyor. Bu yüzden hata çıktısı annotation'a parçalanarak
      # basılıyor ve dosya artifact'a ekleniyor; aksi hâlde kırmızının nedeni
      # görünmez oluyor.
      - name: Lighthouse CI kapısı (mobil · perf ≥ 0,85 · a11y ≥ 0,95)
        run: |
          rc=0
          npm run test:lighthouse > /tmp/lhci.log 2>&1 || rc=$?
          tail -n 40 /tmp/lhci.log
          if [ "$rc" -ne 0 ]; then
            python3 - <<'PY'
          body = open("/tmp/lhci.log", errors="ignore").read()
          parts = [body[i:i + 3500] for i in range(0, min(len(body), 10500), 3500)]
          for index, part in enumerate(parts, start=1):
              escaped = part.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Lighthouse hatasi {index}/{len(parts)}::{escaped}")
          PY
            exit 1
          fi

      - name: Upload Lighthouse raporları
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci
            /tmp/lhci.log
          if-no-files-found: warn
          retention-days: 7

      # A6: kaynak haritaları `hidden` üretilir ve postbuild onları `dist` dışına
      # taşır; yayında URL'leri yok. Hata ayıklama için burada artifact olarak
      # saklanır (yalnız başarılı derlemede, 7 gün).
      - name: Upload source maps
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-maps
          path: sourcemaps/
          retention-days: 7
          if-no-files-found: warn
