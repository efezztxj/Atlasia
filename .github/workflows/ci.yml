name: Atlasia CI

on:
  pull_request:
  push:
    branches: [main, "arena/**"]

permissions:
  contents: read

concurrency:
  group: atlasia-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security, typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Use Java 21 for the Firestore emulator
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache the pinned Firestore emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/atlasia/firebase-emulators
          key: firestore-emulator-${{ runner.os }}-1.22.0

      - name: Install exact dependencies
        run: npm ci

      - name: Check production dependency security baseline
        run: npm run audit:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Script tests (no credentials)
        run: npm run test:scripts

      - name: Firestore security rules tests
        run: npm run test:rules:emulator

      - name: Production build and bundle budget
        run: npm run build
