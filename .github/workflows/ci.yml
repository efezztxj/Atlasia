name: Atlasia CI

on:
  pull_request:
  push:
    branches: [main, "arena/**"]

permissions:
  contents: read

concurrency:
  group: atlasia-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security, typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Use Java 21 for the Firestore emulator
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Cache the pinned Firestore emulator
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/atlasia/firebase-emulators
          key: firestore-emulator-${{ runner.os }}-1.22.0

      - name: Install exact dependencies
        run: npm ci

      - name: Check production dependency security baseline
        run: npm run audit:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Owner index script tests (no credentials)
        run: npm run test:owner-index

      - name: Firestore security rules tests
        id: rules-tests
        run: |
          set -o pipefail
          npm run test:rules:emulator 2>&1 | tee rules-emulator.log

      # Emülatör adımının logu Actions arayüzü dışında okunamıyor; başarısızlıkta
      # ilgili satırları check-run annotation'ına ve iş özetine taşır. Böylece
      # hangi kural testinin neden düştüğü API üzerinden de görünür olur.
      - name: Kural testi hatasını annotation ve iş özetine taşı
        if: always() && steps.rules-tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          log = Path("rules-emulator.log").read_text(encoding="utf-8", errors="replace")
          lines = log.splitlines()
          keys = ("FAIL ", "✕", "×", "AssertionError", "Error:", "Test Files", "Tests  ", "expected", "permission-denied")
          picked = [line for line in lines if any(key in line for key in keys)][:60] or lines[-60:]
          body = "\n".join(picked)[:6000]
          escaped = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Firestore kural testleri basarisiz::{escaped}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## Firestore kural testleri — başarısız\n\n```\n" + body + "\n```\n")
          PY

      - name: Production build
        run: npm run build
