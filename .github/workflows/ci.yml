name: Atlasia CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atlasia-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security, typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Use Java 21 for the Firestore emulator
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Cache the pinned Firestore emulator
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/atlasia/firebase-emulators
          key: firestore-emulator-${{ runner.os }}-1.22.0

      - name: Install exact dependencies
        run: npm ci

      - name: Check production dependency security baseline
        run: npm run audit:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Firestore security rules tests
        run: npm run test:rules:emulator

      - name: Production build
        run: npm run build
