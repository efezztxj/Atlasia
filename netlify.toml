# Netlify yapılandırması — Atlasia
# Bu dosya GitHub'a push'lanır, Netlify otomatik okur.

[build]
  base    = "."
  publish = "dist"
  command = "npm run build"

# Build ortamı değişkenleri
[build.environment]
  # Netlify'ın secrets scanning özelliğini kapat (Firebase config public, false positive veriyor)
  SECRETS_SCAN_ENABLED = "false"
  # Project ID'yi scanning'den muaf tut
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_AUTH_DOMAIN"

# SPA routing: tüm yollar index.html'e düşsün (React Router kullanıyorsan gerekli)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache headers: asset'ler 1 yıl cache'li, HTML 1 saat
[[headers]]
  for   = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "geolocation=(self), microphone=(), camera=()"

[[headers]]
  for   = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for   = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for   = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for   = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for   = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for   = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for   = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
