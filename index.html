    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atlasia — Dünyayı merakınla keşfet" />
    <meta
      name="twitter:description"
      content="Atlasia — 3B dünya haritasında ve uydu görüntülerinde gezginlerin bıraktığı izleri keşfet; rotanı planla, kendi keşfini haritaya bırak."
    />
    <meta name="twitter:image" content="https://atlasia.pages.dev/images/atlasia-share-card.jpg" />
    <meta
      name="twitter:image:alt"
      content="Atlasia logosu ve gece Dünya görünümü üzerinde Dünyayı merakınla keşfet mesajı"
    />
    <meta name="theme-color" content="#ffffff" />
    <!-- T19: tek kanonik adres. Sayfa sorgu parametreleriyle paylaşılsa bile
         arama motoruna tek URL bildirilir (kopya içerik riski yok). -->
    <link rel="canonical" href="https://atlasia.pages.dev/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- T18/T19: tek dil (tr). hreflang bugün için tek kayıt; ikinci dil
         eklenirse buraya `alternate` satırı ve dil seçici birlikte gelir. -->
    <link rel="alternate" hreflang="tr" href="https://atlasia.pages.dev/" />
    <link rel="alternate" hreflang="x-default" href="https://atlasia.pages.dev/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <!-- A1: CSP `script-src 'self'` satır içi betiği engelliyordu; tema ilk
         karede uygulanmıyordu. Ayrı dosya, senkron ve ilk boyamadan önce. -->
    <script src="/theme-boot.js"></script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atlasia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Yapısal veri: arama motorları ve paylaşım önizlemeleri için.
         Yalnız doğru olan alanlar yazılır; puan/fiyat gibi doğrulanamayan
         değerler bilinçli olarak yoktur. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://atlasia.pages.dev/#organization",
            "name": "Atlasia",
            "url": "https://atlasia.pages.dev/",
            "logo": "https://atlasia.pages.dev/icons/icon-512.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://atlasia.pages.dev/#website",
            "url": "https://atlasia.pages.dev/",
            "name": "Atlasia",
            "inLanguage": "tr-TR",
            "publisher": { "@id": "https://atlasia.pages.dev/#organization" }
          },
          {
            "@type": "WebApplication",
            "name": "Atlasia",
            "url": "https://atlasia.pages.dev/uygulama/",
            "applicationCategory": "TravelApplication",
            "operatingSystem": "Web",
            "inLanguage": "tr-TR",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TRY" },
            "description": "Keşif haritası, gezgin izleri, rota planlama ve konum tabanlı sesli rehber."
          }
        ]
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <title>Atlasia — Dünyayı merakınla keşfet</title>
    <!-- B2: fontlar self-host; dış istek yok. CSS'i erken ve senkron yükle:
         font-display: swap, ilk karede sistem fontuyla boyanıp takas edilir. -->
    <!-- B1: LCP görseli için ön yükleme. `imagesrcset`/`imagesizes` <picture>
         ile AYNI adayları verir; tarayıcı aynı URL'yi seçer (çift indirme yok).
         AVIF desteklemeyen tarayıcı bu ipucunu yok sayar, <picture> devralır. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/images/hero-480.avif 480w, /images/hero-768.avif 768w, /images/hero-1376.avif 1376w"
      imagesizes="100vw"
    />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans-latin-wght-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/bricolage-grotesque-latin-wght-normal.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
